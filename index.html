<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebAR Business Card</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: assets/targets/targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true">

  <a-assets>
    <img id="logo" src="assets/images/logo.png">

    <a-asset-item
        id="phoneModel"
        src="assets/models/phone.glb">
    </a-asset-item>
  </a-assets>

  <a-camera 
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse"
      raycaster="objects: .clickable">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity id="ar-content">

      <a-gltf-model
          id="phone"
          src="#phoneModel"
          position="0 -0.55 0.02"
          rotation="0 0 0"
          scale="2 2 2"

          animation__float="
             property: position;
             from: 0 -0.55 0.02;
             to: 0 -0.45 0.02;
             dir: alternate;
             loop: true;
             dur: 1500;
             easing: easeInOutSine;"

          animation__rotate="
             property: rotation;
             to: 0 360 0;
             loop: true;
             dur: 8000;
             easing: linear;">
      </a-gltf-model>

      <a-plane
          id="website-button"
          class="clickable"
          color="#1E88E5"
          width="0.8"
          height="0.22"
          position="0 -0.05 0"
          text="value: WEBSITE; align: center; color: white; width: 4">
      </a-plane>

      <a-plane
        id="company-logo"
        src="#logo"
        position="0 0.55 0"
        width="0.6"
        height="0.6"
        transparent="true"

        animation__scale="
        property: scale;
        from: 0 0 0;
        to: 1 1 1;
        dur: 800;
        easing: easeOutBack;"

       animation__rotate="
        property: rotation;
        from: 0 0 0;
        to: 0 360 0;
        loop: true;
        dur: 6000;
        easing: linear;">
      </a-plane>

    </a-entity>

  </a-entity>

</a-scene>

<script src="js/events.js"></script>
<script src="js/app.js"></script>

</body>
</html>
